<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triton Group — Sales Portal</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="is-locked">

<!-- ============ cursor ============ -->
<div class="cursor" id="cursorDot" aria-hidden="true"></div>
<div class="cursor-ring" id="cursorRing" aria-hidden="true"><span class="cursor-label" id="cursorLabel"></span></div>

<!-- ============ grain + vignette ============ -->
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<!-- ============ transition wipe ============ -->
<div class="wipe" id="wipe" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>

<!-- ============ top bar ============ -->
<header class="topbar" id="topbar">
  <a class="brand" href="#/" data-cursor="home">
    <span class="brand-mark" id="brandMark"></span>
    <span class="brand-text"><b>TRITON</b><i>GROUP</i></span>
  </a>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="topbar-actions">
    <button class="tb-btn" id="searchBtn" data-cursor="search" title="Search  ( / )">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <kbd>/</kbd>
    </button>
    <button class="tb-btn" id="presentBtn" data-cursor="present" title="Presentation mode  ( P )">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    </button>
  </div>
</header>

<!-- ============ HERO (scroll-expand) ============ -->
<section class="hero" id="hero">
  <div class="hero-bg" id="heroBg">
    <div class="hero-bg-fallback"></div>
    <img id="heroBgImg" src="assets/media/hero-bg.jpg" alt="" onerror="this.remove()">
    <div class="hero-bg-scrim"></div>
  </div>

  <div class="hero-stage">
    <div class="hero-box" id="heroBox">
      <div class="hero-media">
        <video id="heroVideo" src="assets/media/hero.mp4" poster="assets/media/hero-poster.jpg"
               autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>
        <div class="hero-media-fallback"></div>
        <div class="hero-media-scrim" id="heroMediaScrim"></div>
      </div>
      <div class="hero-meta">
        <p class="hero-date" id="heroDate">Sales Deck · Kit</p>
        <p class="hero-cue" id="heroCue">Scroll to expand<span class="cue-line"></span></p>
      </div>
    </div>

    <h1 class="hero-title" id="heroTitle">
      <span class="hw hw-a" id="heroWordA">TRITON</span>
      <span class="hw hw-b" id="heroWordB">GROUP</span>
    </h1>
  </div>

  <div class="hero-progress" id="heroProgress"><span></span></div>
</section>

<!-- ============ ROUTED CONTENT ============ -->
<main class="stage" id="stage" aria-live="polite"></main>

<footer class="foot" id="foot">
  <span>Triton Group · Internal Sales Kit</span>
  <span class="foot-hint">Works fully offline · <kbd>/</kbd> search · <kbd>P</kbd> present · <kbd>Esc</kbd> back</span>
</footer>

<!-- ============ SEARCH OVERLAY ============ -->
<div class="search" id="search" hidden>
  <div class="search-panel">
    <div class="search-field">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="Search projects, folders, files…" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<!-- ============ VIEWER ============ -->
<div class="viewer" id="viewer" hidden>
  <div class="viewer-bar">
    <div class="viewer-title" id="viewerTitle"></div>
    <div class="viewer-tools">
      <button class="v-btn" id="viewerOpen"  title="Open in new window">Open</button>
      <button class="v-btn" id="viewerFull"  title="Fullscreen">Fullscreen</button>
      <button class="v-btn v-close" id="viewerClose" title="Close  ( Esc )">Close</button>
    </div>
  </div>
  <div class="viewer-body" id="viewerBody"></div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
