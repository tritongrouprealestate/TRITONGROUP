<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triton Group — Sales Portal</title>
<!--STYLES-->
</head>
<body class="is-locked">

<!-- ============ cursor ============ -->
<div class="cursor" id="cursorDot" aria-hidden="true"></div>
<div class="cursor-ring" id="cursorRing" aria-hidden="true"><span class="cursor-label" id="cursorLabel"></span></div>

<!-- ============ grain + vignette ============ -->
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<!-- ============ transition wipe ============ -->
<div class="wipe" id="wipe" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>

<!-- ============ top bar ============ -->
<header class="topbar" id="topbar">
  <a class="brand" href="#/" data-cursor="home">
    <img class="brand-logo" id="brandLogo" src="" alt="Triton Group"
         onerror="this.remove()" onload="this.closest('.brand').classList.add('has-logo')">
    <span class="brand-text"><b>Triton</b><i>Villas · Apartments · Commercial</i></span>
  </a>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="topbar-actions">
    <button class="tb-btn" id="searchBtn" data-cursor="search" title="Search  ( / )">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <kbd>/</kbd>
    </button>
    <button class="tb-btn" id="presentBtn" data-cursor="present" title="Presentation mode  ( P )">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    </button>
    <button class="tb-btn tb-update" id="updateBtn" data-cursor="update"
            title="Re-read the collaterals folder from disk">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      <span>Update</span><em id="libStamp"></em>
    </button>
    <input type="file" id="dirInput" webkitdirectory directory multiple hidden>
  </div>
</header>

<!-- ============ HERO (scroll-expand) ============ -->
<section class="hero" id="hero">
  <div class="hero-bg" id="heroBg">
    <div class="hero-bg-fallback"></div>
    <img id="heroBgImg" src="" alt="" onerror="this.remove()">
    <div class="hero-bg-scrim"></div>
  </div>

  <div class="hero-stage">
    <div class="hero-box" id="heroBox">
      <div class="hero-media">
        <video id="heroVideo"
               autoplay muted loop playsinline preload="auto" disablepictureinpicture></video>
        <div class="hero-media-fallback"></div>
        <div class="hero-media-scrim" id="heroMediaScrim"></div>
      </div>
      <div class="hero-meta">
        <p class="hero-date" id="heroDate">Sales Deck · Kit</p>
        <p class="hero-cue" id="heroCue">Scroll to expand<span class="cue-line"></span></p>
      </div>
    </div>

    <h1 class="hero-title" id="heroTitle">
      <span class="hw hw-a" id="heroWordA">TRITON</span>
      <span class="hw hw-b" id="heroWordB">GROUP</span>
    </h1>
  </div>

  <div class="hero-progress" id="heroProgress"><span></span></div>
</section>

<!-- ============ ROUTED CONTENT ============ -->
<main class="stage" id="stage" aria-live="polite"></main>

<footer class="foot" id="foot">
  <div class="foot-brand">
    <img class="foot-logo" id="footLogo" src="" alt="Triton Group"
         onerror="this.remove()" onload="this.closest('.foot-brand').classList.add('has-logo')">
    <span class="foot-word"><b>Triton</b><i>Villas. Apartments. Commercial.</i></span>
  </div>
  <div class="foot-meta">
    <span>Internal Sales Kit · Works fully offline</span>
    <span class="foot-hint"><kbd>/</kbd> search · <kbd>P</kbd> present · <kbd>Esc</kbd> back</span>
  </div>
</footer>

<div class="toast" id="toast" aria-live="polite"></div>

<!-- ============ SEARCH OVERLAY ============ -->
<div class="search" id="search" hidden>
  <div class="search-panel">
    <div class="search-field">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="searchInput" type="text" placeholder="Search projects, folders, files…" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<!--SCRIPTS-->
</body>
</html>
