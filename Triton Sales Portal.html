<!DOCTYPE html>
<!-- Triton Group — Offline Sales Portal
     Built 2026-09-07 from src/. Do not edit this file
     by hand; edit src/ and run: node tools/build.mjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triton Group — Sales Portal</title>
<style>
/* ============================================================
   TRITON GROUP — Offline Sales Portal
   Theme tokens live here. Change these 8 lines to re-brand.
   ============================================================ */
:root{
  /* light editorial — white, airy, Apple-like */
  --paper:#ffffff;        /* page */
  --paper-2:#fbfbfa;      /* cards / tiles */
  --paper-3:#f4f4f2;      /* hover */
  --line:rgba(0,0,0,.085);
  --line-2:rgba(0,0,0,.17);
  --fg:#111214;
  --fg-dim:rgba(17,18,20,.60);
  --fg-faint:rgba(17,18,20,.38);
  --accent:#a8762c;       /* restrained bronze */
  --accent-2:#c4913d;
  --radius:16px;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);
  --serif:"Didot","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --topbar-h:64px;
  --shadow-1:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.05);
  --shadow-2:0 2px 6px rgba(0,0,0,.06),0 22px 48px rgba(0,0,0,.10);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:auto;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--fg);
  font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body.is-locked{overflow:hidden;height:100dvh}
img,video{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
kbd{
  font:600 10px/1 var(--sans);padding:3px 5px;border-radius:4px;
  border:1px solid var(--line);color:var(--fg-dim);background:rgba(0,0,0,.03);
}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
::selection{background:rgba(168,118,44,.22);color:#111214}

/* ---------- scrollbar ---------- */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--paper)}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:20px;border:3px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

/* ============ grain + vignette ============ */
.grain{
  position:fixed;inset:-150%;z-index:9000;pointer-events:none;opacity:.022;
  mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  animation:grain 700ms steps(2,end) infinite;
}
@keyframes grain{
  0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}
  50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-2%)}100%{transform:translate(3%,1%)}
}
.vignette{
  position:fixed;inset:0;z-index:8990;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 62%,rgba(0,0,0,.05) 100%);
}

/* ============ cursor ============ */
.cursor,.cursor-ring{position:fixed;top:0;left:0;z-index:9500;pointer-events:none;
  border-radius:999px;will-change:transform}
.cursor{width:6px;height:6px;background:var(--fg);margin:-3px 0 0 -3px;
  transition:opacity .3s,transform .18s var(--ease)}
.cursor-ring{
  width:38px;height:38px;margin:-19px 0 0 -19px;border:1px solid rgba(0,0,0,.22);
  display:grid;place-items:center;
  transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),
             background .35s var(--ease),border-color .35s var(--ease),opacity .3s;
}
.cursor-label{font:600 9px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:#fff;opacity:0;transition:opacity .25s;white-space:nowrap}
body.cur-hot .cursor-ring{width:76px;height:76px;margin:-38px 0 0 -38px;
  background:var(--fg);border-color:var(--fg)}
body.cur-hot .cursor-label{opacity:1}
body.cur-hot .cursor{opacity:0}
@media (hover:none),(pointer:coarse){.cursor,.cursor-ring{display:none}}

/* ============ transition wipe ============ */
.wipe{position:fixed;inset:0;z-index:9200;pointer-events:none;display:flex}
.wipe span{flex:1;background:var(--paper);transform:scaleY(0);transform-origin:bottom;
  transition:transform .5s var(--ease-in-out)}
.wipe.in span{transform:scaleY(1);transform-origin:bottom}
.wipe.out span{transform:scaleY(0);transform-origin:top}
.wipe span:nth-child(2){transition-delay:.05s}
.wipe span:nth-child(3){transition-delay:.1s}
.wipe span:nth-child(4){transition-delay:.15s}
.wipe span:nth-child(5){transition-delay:.2s}

/* ============ topbar ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:8000;
  display:flex;align-items:center;gap:22px;padding:0 clamp(18px,3.5vw,44px);
  background:rgba(255,255,255,.78);border-bottom:1px solid transparent;
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  opacity:0;transform:translateY(-14px);pointer-events:none;
  transition:opacity .7s var(--ease),transform .7s var(--ease),background .4s;
}
.topbar.show{opacity:1;transform:none;pointer-events:auto}
.topbar.solid{background:rgba(255,255,255,.86);border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;flex:0 0 auto}
.brand-mark{
  width:26px;height:26px;border-radius:7px;flex:0 0 auto;
  background:conic-gradient(from 210deg,var(--accent),var(--accent-2),#8a6f14,var(--accent));
  box-shadow:0 3px 10px rgba(168,118,44,.28);
  transition:transform .6s var(--ease);
}
.brand:hover .brand-mark{transform:rotate(135deg) scale(1.08)}
.brand-text{font:600 13px/1 var(--sans);letter-spacing:.22em}
.brand-text b{font-weight:700}
.brand-text i{font-style:normal;color:var(--accent);margin-left:5px}
.crumbs{display:flex;align-items:center;gap:9px;flex:1;min-width:0;overflow:hidden}
.crumbs a,.crumbs span{font:500 11.5px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;
  color:var(--fg-faint);text-decoration:none;white-space:nowrap;transition:color .3s}
.crumbs a:hover{color:var(--accent)}
.crumbs .sep{color:var(--fg-faint);opacity:.5}
.crumbs .cur{color:var(--fg)}
.topbar-actions{display:flex;gap:8px;flex:0 0 auto}
.tb-btn{
  display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;
  border:1px solid var(--line);color:var(--fg-dim);background:var(--paper-2);
  transition:color .3s,border-color .3s,background .3s,transform .3s var(--ease);
}
.tb-btn:hover{color:#fff;background:var(--fg);border-color:var(--fg);transform:translateY(-2px)}
.tb-btn:hover kbd{color:rgba(255,255,255,.75);border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.12)}

/* ============================================================
   HERO — scroll expand
   ============================================================ */
.hero{position:relative;height:100dvh;width:100%;overflow:hidden;isolation:isolate;background:var(--paper)}
.hero-bg{position:absolute;inset:0;z-index:0;will-change:opacity,transform}
.hero-bg-fallback{
  position:absolute;inset:0;
  background:
    radial-gradient(80% 60% at 20% 15%,rgba(201,162,39,.22),transparent 60%),
    radial-gradient(70% 70% at 82% 78%,rgba(60,110,150,.28),transparent 62%),
    linear-gradient(160deg,#0b1016,#14171d 45%,#07080a);
}
.hero-bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.hero-bg-scrim{position:absolute;inset:0;background:rgba(0,0,0,.28)}
.hero-stage{position:relative;z-index:2;height:100dvh;display:grid;place-items:center}

.hero-box{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  max-width:95vw;max-height:86vh;border-radius:20px;
  box-shadow:0 40px 120px rgba(0,0,0,.34),0 0 0 1px rgba(0,0,0,.05);
  z-index:1;
}
.hero-media{position:relative;width:100%;height:100%;border-radius:18px;overflow:hidden}
.hero-media-fallback{
  position:absolute;inset:0;z-index:0;
  background:linear-gradient(140deg,#1b2430,#0b0d10 60%,#241d08);
}
.hero-media video{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover}
.hero-media-scrim{position:absolute;inset:0;z-index:2;background:#000;opacity:.5;
  transition:opacity .2s linear}
.hero-meta{
  position:absolute;left:0;right:0;top:calc(100% + 18px);
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
}
.hero-date{margin:0;font:500 12px/1 var(--sans);letter-spacing:.4em;text-transform:uppercase;
  color:var(--accent-2);will-change:transform}
.hero-cue{margin:0;font:500 11px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;
  color:rgba(255,255,255,.72);display:flex;flex-direction:column;align-items:center;gap:10px;
  will-change:transform}
.cue-line{display:block;width:1px;height:34px;
  background:linear-gradient(180deg,var(--accent-2),transparent);
  animation:cueDrop 1.9s var(--ease-in-out) infinite}
@keyframes cueDrop{0%{transform:scaleY(0);transform-origin:top}
  45%{transform:scaleY(1);transform-origin:top}
  55%{transform:scaleY(1);transform-origin:bottom}
  100%{transform:scaleY(0);transform-origin:bottom}}

.hero-title{
  position:relative;z-index:3;margin:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(2px,1vh,10px);
  mix-blend-mode:difference;pointer-events:none;text-align:center;width:100%;
}
.hw{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(44px,9.5vw,132px);line-height:.92;letter-spacing:.02em;
  color:#dfe7f2;will-change:transform;display:block;
}
.hw-b{font-style:italic;letter-spacing:.06em}

.hero-progress{position:absolute;left:0;right:0;bottom:0;height:2px;z-index:4;
  background:rgba(0,0,0,.06)}
.hero-progress span{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.hero.done .hero-progress{opacity:0;transition:opacity .6s}
.hero.done .hero-meta{opacity:0;transition:opacity .5s}

/* ============================================================
   STAGE / routed views
   ============================================================ */
.stage{
  position:relative;z-index:5;background:var(--paper);
  min-height:calc(100dvh - var(--topbar-h) - 96px);padding:clamp(48px,9vh,110px) clamp(18px,4vw,64px) 90px;
  opacity:0;transform:translateY(26px);
  transition:opacity .8s var(--ease),transform .8s var(--ease);
}
.stage.show{opacity:1;transform:none}
.view{max-width:1480px;margin:0 auto}

/* ---------- section heading ---------- */
.sec-head{margin:0 0 clamp(30px,5vh,58px);display:flex;align-items:flex-end;
  justify-content:space-between;gap:24px;flex-wrap:wrap}
.sec-eyebrow{margin:0 0 12px;font:600 11px/1 var(--sans);letter-spacing:.42em;
  text-transform:uppercase;color:var(--accent)}
.sec-title{margin:0;font-family:var(--serif);font-weight:400;
  font-size:clamp(34px,5.6vw,74px);line-height:1;letter-spacing:.005em}
.sec-title em{font-style:italic;color:var(--accent)}
.sec-sub{margin:14px 0 0;max-width:52ch;color:var(--fg-dim);font-size:14.5px}
.sec-count{font:600 11px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;
  color:var(--fg-faint);padding-bottom:8px}

/* ---------- project cards (TravelCard format) ---------- */
.projects{display:grid;gap:clamp(18px,2.2vw,30px);
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}

.pcard{
  position:relative;display:block;overflow:hidden;
  border-radius:14px;border:1px solid var(--line);background:var(--paper-2);
  width:100%;aspect-ratio:13/12;min-height:440px;
  text-decoration:none;color:inherit;isolation:isolate;
  box-shadow:var(--shadow-1);
  transform-style:preserve-3d;will-change:transform;
  transition:box-shadow .45s var(--ease),border-color .45s var(--ease);
}
.pcard:hover{box-shadow:var(--shadow-2);border-color:var(--line-2)}

/* image + zoom on hover */
.pcard-media{position:absolute;inset:0;z-index:0;overflow:hidden}
.pcard-media img{width:100%;height:100%;object-fit:cover;
  transition:transform .6s var(--ease-in-out)}
.pcard:hover .pcard-media img{transform:scale(1.10)}
.pcard-fallback{position:absolute;inset:0;
  background:var(--pc,linear-gradient(150deg,#1c2734,#0a0d12 62%,#241d08));
  transition:transform .6s var(--ease-in-out)}
.pcard:hover .pcard-fallback{transform:scale(1.10)}
.pcard-fallback::after{content:"";position:absolute;inset:0;opacity:.45;
  background:repeating-linear-gradient(115deg,transparent 0 24px,rgba(255,255,255,.035) 24px 25px)}

/* readability gradient: from-black/80 via-black/40 to-transparent */
.pcard-scrim{position:absolute;inset:0;z-index:1;
  background:linear-gradient(to top,rgba(0,0,0,.82) 0%,rgba(0,0,0,.42) 48%,transparent 100%)}
.pcard-sheen{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .5s;
  background:radial-gradient(360px 360px at var(--mx,50%) var(--my,50%),
    rgba(201,162,39,.22),transparent 70%)}
.pcard:hover .pcard-sheen{opacity:1}

/* content column */
.pcard-inner{position:relative;z-index:3;display:flex;flex-direction:column;
  justify-content:space-between;height:100%;padding:24px}

/* top: logo chip */
.pcard-top{display:flex;align-items:flex-start;height:clamp(96px,15vh,160px)}
.pcard-logo{display:grid;place-items:center;width:48px;height:48px;border-radius:999px;
  border:2px solid rgba(255,255,255,.5);background:rgba(0,0,0,.2);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:rgba(255,255,255,.85);
  transition:border-color .45s,background .45s,transform .55s var(--ease)}
.pcard:hover .pcard-logo{border-color:var(--accent);color:var(--accent);transform:scale(1.06)}
.pcard-logo svg{width:24px;height:24px}

/* middle: details, slide up on hover */
.pcard-body{transition:transform .5s var(--ease-in-out)}
.pcard:hover .pcard-body{transform:translateY(-72px)}
.pcard-name{margin:0;font-family:var(--sans);font-weight:700;letter-spacing:-.02em;
  font-size:clamp(28px,2.7vw,34px);line-height:1.1;color:#fff}
.pcard-loc{margin:2px 0 0;font-size:13.5px;color:rgba(255,255,255,.8)}
.pcard-ov{margin-top:16px}
.pcard-ov h4{margin:0 0 4px;font:600 12.5px/1.4 var(--sans);letter-spacing:.06em;
  color:rgba(255,255,255,.9)}
.pcard-ov p{margin:0;font-size:13.5px;line-height:1.62;color:rgba(255,255,255,.7)}

/* bottom bar: revealed on hover */
.pcard-foot{position:absolute;left:0;bottom:-88px;z-index:4;width:100%;padding:24px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  opacity:0;transition:bottom .5s var(--ease-in-out),opacity .5s var(--ease-in-out)}
.pcard-foot::before{content:"";position:absolute;inset:-40px 0 0;z-index:-1;
  background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,.55) 55%,transparent)}
.pcard:hover .pcard-foot,.pcard:focus-visible .pcard-foot{bottom:0;opacity:1}
.pcard-figure{line-height:1;white-space:nowrap}
.pcard-figure b{font:700 34px/1 var(--sans);letter-spacing:-.02em;color:#fff}
.pcard-figure span{margin-left:6px;font-size:13.5px;color:rgba(255,255,255,.8)}
.pcard-cta{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;
  border-radius:8px;background:#fff;color:#000;font:600 14px/1 var(--sans);
  transition:background .3s,transform .35s var(--ease)}
.pcard:hover .pcard-cta{transform:translateX(0)}
.pcard-cta:hover{background:rgba(255,255,255,.9)}
.pcard-cta svg{width:16px;height:16px;stroke-width:2;
  transition:transform .35s var(--ease)}
.pcard:hover .pcard-cta svg{transform:translateX(4px)}

/* archive treatment */
.pcard.archive{filter:saturate(.28) brightness(.86)}
.pcard.archive:hover{filter:none}
.pcard-flag{position:absolute;top:24px;right:24px;z-index:4;
  padding:6px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.34);
  background:rgba(0,0,0,.28);backdrop-filter:blur(6px);
  font:600 9.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.82)}

@media (max-width:560px){
  .pcard{min-height:400px;aspect-ratio:auto}
  .pcard-top{height:80px}
  .pcard:hover .pcard-body{transform:translateY(-58px)}
}

/* ---------- folder / file tiles ---------- */
.tiles{display:grid;gap:clamp(12px,1.5vw,18px);
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tile{
  position:relative;display:flex;flex-direction:column;justify-content:space-between;
  gap:26px;min-height:186px;padding:22px;text-align:left;text-decoration:none;color:inherit;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);
  overflow:hidden;box-shadow:var(--shadow-1);
  transition:border-color .45s,background .45s,transform .5s var(--ease),box-shadow .5s var(--ease);
}
.tile::before{
  content:"";position:absolute;inset:0;opacity:0;transition:opacity .45s;
  background:radial-gradient(300px 200px at var(--mx,50%) var(--my,50%),rgba(168,118,44,.10),transparent 70%);
}
.tile:hover{border-color:var(--line-2);background:var(--paper);transform:translateY(-5px);box-shadow:var(--shadow-2)}
.tile:hover::before{opacity:1}
.tile-ico{position:relative;display:grid;place-items:center;width:44px;height:44px;
  border-radius:12px;border:1px solid var(--line);color:var(--accent);background:var(--paper-2);
  transition:background .45s,color .45s,border-color .45s}
.tile:hover .tile-ico{background:var(--fg);border-color:var(--fg);color:#fff}
.tile-ico svg{width:20px;height:20px}
.tile-name{position:relative;margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em;
  line-height:1.28;word-break:break-word}
.tile-sub{position:relative;margin:7px 0 0;font:600 10px/1 var(--sans);letter-spacing:.2em;
  text-transform:uppercase;color:var(--fg-faint)}
.tile-badge{position:absolute;top:20px;right:20px;font:600 9.5px/1 var(--sans);
  letter-spacing:.16em;text-transform:uppercase;color:var(--fg-faint);
  border:1px solid var(--line);border-radius:999px;padding:5px 9px}

/* missing-file state */
.tile.missing{opacity:.45}
.tile.missing .tile-ico{color:var(--fg-faint)}
.tile.missing:hover{transform:none}

/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(30px);
  transition:opacity .85s var(--ease),transform .85s var(--ease)}
.rv.in{opacity:1;transform:none}

/* ---------- empty state ---------- */
.empty{padding:70px 26px;text-align:center;border:1px dashed var(--line);
  border-radius:var(--radius);color:var(--fg-dim)}
.empty h3{margin:0 0 10px;font-family:var(--serif);font-weight:400;font-size:26px;color:var(--fg)}
.empty code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  background:rgba(168,118,44,.09);padding:3px 7px;border-radius:5px;color:var(--accent)}

/* ---------- back link ---------- */
.back{display:inline-flex;align-items:center;gap:10px;margin-bottom:26px;
  font:600 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;
  color:var(--fg-faint);text-decoration:none;transition:color .3s,gap .3s var(--ease)}
.back:hover{color:var(--accent);gap:16px}

/* ============ footer ============ */
.foot{position:relative;z-index:5;display:flex;justify-content:space-between;
  align-items:center;gap:20px;flex-wrap:wrap;
  padding:26px clamp(18px,4vw,64px);border-top:1px solid var(--line);
  background:var(--paper-2);font:500 11px/1.6 var(--sans);letter-spacing:.16em;
  text-transform:uppercase;color:var(--fg-faint)}
.foot-hint{display:flex;align-items:center;gap:7px;flex-wrap:wrap}

/* ============ search ============ */
.search{position:fixed;inset:0;z-index:9100;display:grid;place-items:start center;
  padding:12vh 20px;background:rgba(250,250,249,.72);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  opacity:0;transition:opacity .35s var(--ease)}
.search.show{opacity:1}
.search-panel{width:min(760px,100%);border:1px solid var(--line-2);border-radius:20px;
  background:var(--paper);overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.04);
  transform:translateY(-14px) scale(.985);transition:transform .4s var(--ease)}
.search.show .search-panel{transform:none}
.search-field{display:flex;align-items:center;gap:14px;padding:20px 22px;
  border-bottom:1px solid var(--line)}
.search-field svg{color:var(--accent);flex:0 0 auto}
.search-field input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--fg);
  font-size:19px;font-family:var(--sans)}
.search-field input::placeholder{color:var(--fg-faint)}
.search-results{max-height:52vh;overflow-y:auto;padding:8px}
.sr{display:flex;align-items:center;gap:14px;width:100%;padding:13px 15px;border-radius:12px;
  text-align:left;text-decoration:none;color:inherit;transition:background .2s}
.sr:hover,.sr.sel{background:var(--paper-3)}
.sr.sel{box-shadow:inset 2px 0 0 var(--accent)}
.sr-ico{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;
  border:1px solid var(--line);color:var(--accent);background:var(--paper-2);flex:0 0 auto}
.sr-ico svg{width:17px;height:17px}
.sr-txt{min-width:0}
.sr-name{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-name mark{background:rgba(168,118,44,.18);color:var(--accent);border-radius:3px;padding:0 1px}
.sr-path{margin-top:3px;font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:var(--fg-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-empty{padding:40px 16px;text-align:center;color:var(--fg-faint);font-size:14px}

/* ============ presentation mode ============ */
body.present .topbar,body.present .foot,body.present .grain,body.present .vignette{
  opacity:0;pointer-events:none}
body.present .stage{padding-top:clamp(40px,7vh,80px)}

/* ============ responsive ============ */
@media (max-width:900px){
  :root{--topbar-h:58px}
  .crumbs{display:none}
  .hero-title{gap:0}
}
@media (max-width:560px){
  .tiles{grid-template-columns:1fr 1fr}
  .tile{min-height:150px;padding:16px;gap:16px}
  .tile-name{font-size:14.5px}
  .foot-hint{display:none}
}

/* ============ reduced motion ============ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .grain{display:none}
}

/* files that still need exporting out of Google Drive */
.tile-sub.warn{color:var(--accent);letter-spacing:.06em;text-transform:none;
  font-weight:500;font-size:11px}

/* a class-level `display` beats the UA [hidden] rule — restore it, otherwise the
   overlay sits invisibly over the page and swallows clicks */
.search[hidden]{display:none!important}

/* ============ update button + toast ============ */
.tb-update{padding:0 14px 0 12px;gap:9px}
.tb-update span{font:600 11.5px/1 var(--sans);letter-spacing:.04em}
.tb-update em{font:500 10px/1 var(--sans);font-style:normal;color:var(--fg-faint);
  padding-left:9px;border-left:1px solid var(--line);white-space:nowrap}
.tb-update:hover em{color:rgba(255,255,255,.7);border-left-color:rgba(255,255,255,.25)}
@media (max-width:1080px){.tb-update span,.tb-update em{display:none}.tb-update{padding:0 12px}}

.toast{
  position:fixed;left:50%;bottom:34px;z-index:9400;
  transform:translate(-50%,26px);opacity:0;pointer-events:none;
  display:flex;flex-direction:column;gap:3px;
  min-width:300px;max-width:min(560px,92vw);padding:15px 20px;
  border-radius:13px;border:1px solid var(--line);background:var(--paper);
  box-shadow:0 18px 50px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.03);
  transition:transform .5s var(--ease),opacity .5s var(--ease);
}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast b{font:600 14px/1.3 var(--sans)}
.toast span{font-size:12.5px;color:var(--fg-dim)}
.toast.warn{border-color:rgba(190,60,40,.4)}
.toast.warn b{color:#b0392a}

/* prompt shown when a folder has no files yet */
.empty-cta{display:inline-flex;align-items:center;gap:9px;margin-top:20px;height:42px;
  padding:0 20px;border-radius:9px;background:var(--fg);color:#fff;
  font:600 12.5px/1 var(--sans);transition:transform .35s var(--ease),opacity .3s}
.empty-cta:hover{transform:translateY(-2px);opacity:.9}
.empty-cta svg{width:16px;height:16px;stroke-width:2}

/* ============ YouTube links (the only things here that need internet) ============ */
.tile.online .tile-ico{color:#c4302b}
.tile.online:hover .tile-ico{background:#c4302b;border-color:#c4302b;color:#fff}
.tile.online .tile-badge{color:#c4302b;border-color:rgba(196,48,43,.32)}
.tile-sub.online{color:#c4302b;letter-spacing:.06em;text-transform:none;
  font-weight:500;font-size:11px}

/* ============ media tiles (film + YouTube) ============ */
.tile.media{padding:0;gap:0;justify-content:flex-start;overflow:hidden}
.tile-shot{
  position:relative;display:block;width:100%;aspect-ratio:16/9;overflow:hidden;
  background:linear-gradient(150deg,#3b4a5c,#1a2029 58%,#4a3d22);
}
.tile-shot::after{                      /* keeps the play mark legible on any frame */
  content:"";position:absolute;inset:0;
  background:radial-gradient(60% 60% at 50% 50%,rgba(0,0,0,.34),rgba(0,0,0,.12) 70%,transparent);
}
.tile-shot .shot{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:transform .7s var(--ease);pointer-events:none;
}
.tile.media:hover .tile-shot .shot{transform:scale(1.06)}
.tile-play{
  position:absolute;top:50%;left:50%;z-index:2;
  display:grid;place-items:center;width:46px;height:46px;margin:-23px 0 0 -23px;
  border-radius:999px;background:rgba(255,255,255,.94);color:#111214;
  box-shadow:0 6px 22px rgba(0,0,0,.34);
  transition:transform .4s var(--ease),background .4s;
}
.tile-play svg{width:20px;height:20px;margin-left:2px}
.tile.media:hover .tile-play{transform:scale(1.12)}
.tile.media.online:hover .tile-play{background:#c4302b;color:#fff}
.tile.media .tile-badge{top:12px;right:12px;z-index:3;
  background:rgba(12,14,18,.62);border-color:rgba(255,255,255,.28);color:#fff;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tile.media.online .tile-badge{background:rgba(196,48,43,.92);border-color:transparent}
.tile.media .tile-txt{display:block;padding:15px 18px 17px}
.tile.media .tile-name{margin:0}
.tile.media::before{border-radius:0}

/* ---------- divider between the folders and the online films ---------- */
.sec-split{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  margin:clamp(34px,5vh,56px) 0 clamp(18px,2.4vh,26px);
  padding-top:clamp(24px,3.4vh,34px);border-top:1px solid var(--line)}
.sec-split span{font:600 11px/1 var(--sans);letter-spacing:.34em;text-transform:uppercase;
  color:var(--fg)}
.sec-split em{font-style:normal;font-size:12.5px;color:var(--fg-faint)}

/* the online tile is an <a>, so give it the tile's own layout back */
a.tile{text-decoration:none;color:inherit}
.sr.ext .sr-ico{color:#c4302b}

/* a file tile is an anchor now — keep it looking and behaving like a tile */
a.tile{text-decoration:none;color:inherit}
a.tile:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
div.tile.missing{cursor:default}

/* ---------- document images previewed on their own tile ---------- */
.tile-shot.doc{background:#fff}
.tile-shot.doc::after{                  /* no scrim — it would dim the sheet */
  background:linear-gradient(to bottom,transparent 62%,rgba(0,0,0,.05));
}
.shot.doc{object-position:center top}
.tile-zoom{
  position:absolute;right:11px;bottom:11px;z-index:2;
  display:grid;place-items:center;width:32px;height:32px;border-radius:9px;
  background:rgba(255,255,255,.94);color:#111214;
  box-shadow:0 3px 12px rgba(0,0,0,.2);
  opacity:0;transform:translateY(5px);
  transition:opacity .35s var(--ease),transform .35s var(--ease);
}
.tile-zoom svg{width:15px;height:15px;stroke-width:2}
.tile:hover .tile-zoom{opacity:1;transform:none}

</style>
</head>

  }, { passive: true });

  (function loop() {
    rx += (mx - rx) * 0.16; ry += (my - ry) * 0.16;
    ring.style.transform = 'translate(' + rx + 'px,' + ry + 'px)';
    requestAnimationFrame(loop);
  })();

  addEventListener('mouseover', function (e) {
    var t = e.target.closest('[data-cursor]');
    if (t) { document.body.classList.add('cur-hot'); label.textContent = t.dataset.cursor; }
    else   { document.body.classList.remove('cur-hot'); }
  });
  addEventListener('mouseleave', function () { dot.style.opacity = ring.style.opacity = 0; });
  addEventListener('mouseenter', function () { dot.style.opacity = ring.style.opacity = 1; });
})();

/* ============================================================
   HERO — scroll-expand (ported from ScrollExpandMedia)
   ============================================================ */
var Hero = (function () {
  var hero  = $('#hero'), box = $('#heroBox'), scrim = $('#heroMediaScrim'),
      bg    = $('#heroBg'), title = $('#heroTitle'),
      wA    = $('#heroWordA'), wB = $('#heroWordB'),
      date  = $('#heroDate'), cue = $('#heroCue'),
      bar   = $('#heroProgress').firstElementChild;

  var progress = 0, expanded = false, touchY = 0, done = false;

  function paint() {
    var m = isMobile();
    var w = 300 + progress * (m ? 650 : 1250);
    var h = 400 + progress * (m ? 200 : 400);
    var tx = progress * (m ? 180 : 150);

    box.style.width  = w + 'px';
    box.style.height = h + 'px';
    bg.style.opacity = 1 - progress;
    scrim.style.opacity = 0.5 - progress * 0.3;

    wA.style.transform   = 'translateX(-' + tx + 'vw)';
    wB.style.transform   = 'translateX(' + tx + 'vw)';
    date.style.transform = 'translateX(-' + tx + 'vw)';
    cue.style.transform  = 'translateX(' + tx + 'vw)';

    bar.style.width = (progress * 100) + '%';
  }

  function setProgress(p) {
    progress = clamp(p, 0, 1);
    paint();
    if (progress >= 1 && !expanded) open();
    else if (progress < 1 && expanded) close();
  }

  function open() {
    expanded = true; done = true;
    hero.classList.add('done');
    document.body.classList.remove('is-locked');
    $('#topbar').classList.add('show');
    $('#stage').classList.add('show');
    reveal();
  }
  function close() {
    expanded = false;
    hero.classList.remove('done');
    document.body.classList.add('is-locked');
    $('#stage').classList.remove('show');
  }

  function onWheel(e) {
    if (Route.away) return;                       // not on the home route
    if (expanded && e.deltaY < 0 && scrollY <= 5) { setProgress(0.999); e.preventDefault(); return; }
    if (expanded) return;
    e.preventDefault();
    setProgress(progress + e.deltaY * 0.0009);
  }
  function onTouchStart(e) { touchY = e.touches[0].clientY; }
  function onTouchMove(e) {
    if (Route.away || !touchY) return;
    var d = touchY - e.touches[0].clientY;
    if (expanded && d < -20 && scrollY <= 5) { setProgress(0.999); e.preventDefault(); return; }
    if (expanded) return;
    e.preventDefault();
    setProgress(progress + d * (d < 0 ? 0.008 : 0.005));
    touchY = e.touches[0].clientY;
  }
  function onScroll() { if (!expanded && !Route.away) scrollTo(0, 0); }

  addEventListener('wheel', onWheel, { passive: false });
  addEventListener('touchstart', onTouchStart, { passive: false });
  addEventListener('touchmove', onTouchMove, { passive: false });
  addEventListener('touchend', function () { touchY = 0; });
  addEventListener('scroll', onScroll);
  addEventListener('resize', paint);

  return {
    paint: paint,
    skip: function () { setProgress(1); },
    reset: function () { if (!done) setProgress(0); },
    get expanded() { return expanded; },
    hide: function (on) {
      hero.style.display = on ? 'none' : '';
      if (on) { document.body.classList.remove('is-locked');
                $('#topbar').classList.add('show'); $('#stage').classList.add('show'); }
    }
  };
})();

/* ============================================================
   REVEAL on scroll
   ============================================================ */
var io = null;
function reveal() {
  if (!('IntersectionObserver' in window)) {
    $$('.rv').forEach(function (el) { el.classList.add('in'); }); return;
  }
  if (io) io.disconnect();
  io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });
  $$('.rv:not(.in)').forEach(function (el) { io.observe(el); });
}

/* ============================================================
   POINTER SHEEN + TILT
   ============================================================ */
function bindInteractive(root) {
  $$('.pcard, .tile', root).forEach(function (el) {
    el.addEventListener('pointermove', function (e) {
      var r = el.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width;
      var py = (e.clientY - r.top) / r.height;
      el.style.setProperty('--mx', (px * 100) + '%');
      el.style.setProperty('--my', (py * 100) + '%');
      if (el.classList.contains('pcard') && !matchMedia('(pointer:coarse)').matches) {
        el.style.transform = 'perspective(1100px) rotateX(' + ((0.5 - py) * 5).toFixed(2) +
                             'deg) rotateY(' + ((px - 0.5) * 5).toFixed(2) + 'deg) translateY(-6px)';
      }
    });
    el.addEventListener('pointerleave', function () { el.style.transform = ''; });
  });
}

/* The picture on a video tile.
   YouTube: the saved thumbnail first, then YouTube's own copy if there is a
   connection, then nothing — the panel behind it carries the play mark either way.
   Local film: the browser draws a frame from the file itself, so it needs no
   generated poster and keeps working when the film is replaced. */
function preview(file, k) {
  if (file.youtube)
    return '<img class="shot" alt="" src="' + esc(uri(file.thumb || '')) + '" data-fb="' +
           'https://img.youtube.com/vi/' + esc(file.youtube) + '/hqdefault.jpg">';
  if (k === 'image')
    /* the sheet itself, anchored to its top edge so the heading that identifies
       it is always the part on show */
    return '<img class="shot doc" alt="" loading="lazy" decoding="async" src="' +
           esc(uri(file.path)) + '">';
  return '<video class="shot" muted playsinline preload="metadata" tabindex="-1" src="' +
         esc(uri(file.path)) + '#t=1"></video>';
}

   ============================================================ */
var Route = { away: false };

function findProject(id) {
  return visible().filter(function (p) { return p.id === id; })[0];
}
function findFolder(p, id) {
  return (p.folders || []).filter(function (f) { return f.id === id; })[0];
}

function route() {
  var h = (location.hash || '#/').replace(/^#\/?/, '');
  var parts = h.split('/').filter(Boolean).map(decodeURIComponent);

  if (parts[0] === 'p' && parts[1]) {
    var p = findProject(parts[1]);
    if (!p) { location.hash = '#/'; return; }
    if (parts[2]) {
      var f = findFolder(p, parts[2]);
      if (!f) { location.hash = '#/p/' + p.id; return; }
      Route.away = true; renderFolder(p, f); return;
    }
    Route.away = true; renderProject(p); return;
  }
  Route.away = false;
  renderHome();
  Hero.paint();
  if (Hero.expanded) { $('#topbar').classList.add('show'); $('#stage').classList.add('show'); }
}

addEventListener('hashchange', route);

/* topbar solid on scroll */
addEventListener('scroll', function () {
  $('#topbar').classList.toggle('solid', scrollY > 30);
}, { passive: true });


/* ============================================================
   LIBRARY — scan the collaterals folder, no server, no commands
   ------------------------------------------------------------
   A <input webkitdirectory> hands us the whole recursive tree with
   relative paths. We only use it to LEARN filenames; files are then
   opened by relative path (not blob URLs), so videos stay seekable
   and nothing expires. The result is kept in localStorage, which
   survives a browser restart on file://, so the pick is a one-off.
   ============================================================ */
var Library = (function () {
  var KEY = 'triton.library.v1';

  var SKIP = /^(\.|~\$|desktop\.ini$|thumbs\.db$|\.ds_store$)/i;
  var COVER = /^cover\.(jpe?g|png|webp)$/i;

  function slug(s) {
    return String(s).toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'item';
  }
  function human(b) {
    return b < 1024 ? b + ' B'
         : b < 1048576 ? Math.round(b / 1024) + ' KB'
         : b < 1073741824 ? (b / 1048576).toFixed(1) + ' MB'
         : (b / 1073741824).toFixed(2) + ' GB';
  }

  /* ---- turn a flat FileList into the project/folder/file tree ---- */
  function build(files) {
    var root = '', tree = {}, covers = {};

    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      var parts = (f.webkitRelativePath || f.name).split('/');
      if (!root) root = parts[0];

      var project = parts[1];
      if (!project || SKIP.test(project) || parts.length < 3) continue;   // stray file at the top
      if (project.charAt(0) === '_') continue;      // _Portal etc — not a project

      /* register the project/folder from the path even when the file itself is
         skipped, so empty folders still appear and show what is missing */
      tree[project] = tree[project] || {};

      if (parts.length === 3 && COVER.test(parts[2])) { covers[project] = parts.join('/'); continue; }

      var folder = parts.length >= 4 ? parts[2] : 'General';
      if (SKIP.test(folder)) continue;
      tree[project][folder] = tree[project][folder] || [];

      var name = parts[parts.length - 1];
      if (SKIP.test(name)) continue;
      /* files nested deeper than one level are flattened into their top folder
         rather than dropped, so nothing on disk goes missing */

      tree[project][folder].push({ name: name, path: parts.join('/'), size: human(f.size) });
    }

    /* keep the copy someone wrote by hand in data.js */
    var prev = {};
    BASELINE.forEach(function (p) { prev[p.id] = p; });

    var projects = Object.keys(tree).map(function (pname) {
      var id  = slug(pname);
      var old = prev[id] || {};
      var oldF = {};
      (old.folders || []).forEach(function (f) { oldF[f.id] = f; });

      var folders = Object.keys(tree[pname]).map(function (fname) {
        var fid = slug(fname);
        /* the slots this folder is meant to hold, in their authored order */
        var slots = ((oldF[fid] || {}).files || []);
        var onDisk = {};
        tree[pname][fname].forEach(function (x) { onDisk[x.name] = x; });

        var files = slots.map(function (slot) {
          var hit = onDisk[slot.name];
          delete onDisk[slot.name];
          return hit
            ? { label: slot.label || slot.name, name: slot.name, path: hit.path,
                size: hit.size, note: slot.note }
            : { label: slot.label || slot.name, name: slot.name, path: slot.path,
                missing: true };
        });
        /* anything extra that was dropped in beyond the standard slots */
        Object.keys(onDisk).sort(function (a, b) {
          return a.localeCompare(b, undefined, { numeric: true }); })
          .forEach(function (n) {
            files.push({ label: onDisk[n].name, name: onDisk[n].name,
                         path: onDisk[n].path, size: onDisk[n].size });
          });
        return { id: fid, name: fname, files: files };
      });
      /* keep folders that the manifest knows about but that are absent from disk,
         so a deleted folder shows as empty rather than silently disappearing */
      (old.folders || []).forEach(function (of) {
        if (folders.some(function (f) { return f.id === of.id; })) return;
        folders.push({ id: of.id, name: of.name, files: (of.files || []).map(function (x) {
          return { label: x.label || x.name, name: x.name, path: x.path, missing: true }; }) });
      });
      folders.sort(function (a, b) {
        var oa = (old.folders || []).findIndex(function (f) { return f.id === a.id; });
        var ob = (old.folders || []).findIndex(function (f) { return f.id === b.id; });
        if (oa < 0) oa = 999; if (ob < 0) ob = 999;
        return oa !== ob ? oa - ob : a.name.localeCompare(b.name);
      });

      var archived = old.archive !== undefined ? old.archive : /^(old|archive|backup)$/i.test(pname);
      return {
        id: id, name: old.name || pname,
        location: old.location || '',
        tagline:  old.tagline  || (folders.length + ' folders of sales collateral.'),
        tag:      old.tag      || (archived ? 'Archive' : 'Project'),
        links:    old.links || [],
        cover:    covers[pname] || old.cover || '',
        accent:   old.accent   || 'linear-gradient(155deg,#6d8399,#3b4a5c 55%,#8a7a52)',
        archive:  archived || undefined,
        hidden:   old.hidden !== undefined ? old.hidden : archived,
        folders:  folders
      };
    }).sort(function (a, b) {
      var oa = BASELINE.findIndex(function (p) { return p.id === a.id; });
      var ob = BASELINE.findIndex(function (p) { return p.id === b.id; });
      if (oa < 0) oa = 999; if (ob < 0) ob = 999;
      if (!!a.hidden !== !!b.hidden) return a.hidden ? 1 : -1;
      return oa !== ob ? oa - ob : a.name.localeCompare(b.name);
    });

    return { root: root, at: Date.now(), projects: projects };
  }

  /* ---- persistence ---- */
  function save(lib) { try { localStorage.setItem(KEY, JSON.stringify(lib)); } catch (e) {} }
  function load() {
    try { var v = JSON.parse(localStorage.getItem(KEY)); return v && v.projects && v.projects.length ? v : null; }
    catch (e) { return null; }
  }
  function clear() { try { localStorage.removeItem(KEY); } catch (e) {} }

  function countFiles(ps) {
    return ps.reduce(function (n, p) {
      return n + (p.folders || []).reduce(function (m, f) { return m + f.files.filter(function (x) { return !x.missing; }).length; }, 0); }, 0);
  }

  function apply(lib) {
    D.projects = lib.projects;
    stamp(lib);
  }

  function stamp(lib) {
    var el = $('#libStamp');
    if (!el) return;
    if (!lib) { el.textContent = 'Built-in list'; return; }
    var d = new Date(lib.at);
    el.textContent = 'Updated ' + d.toLocaleDateString(undefined,
      { day: 'numeric', month: 'short' }) + ' · ' + countFiles(lib.projects) + ' files';
  }

  /* ---- the one interaction: pick the folder ---- */
  function scan(files) {
    if (!files || !files.length) return;
    var before = countFiles(D.projects || []);
    var lib = build(files);
    if (!lib.projects.length) { toast('Nothing found in that folder', 'That folder has no project sub-folders inside it.', true); return; }
    save(lib); apply(lib);
    var after = countFiles(lib.projects);
    var delta = after - before;
    toast('Library updated',
      lib.projects.filter(function (p) { return !p.hidden; }).length + ' projects · ' + after + ' files' +
      (delta > 0 ? ' · ' + delta + ' new' : delta < 0 ? ' · ' + (-delta) + ' removed' : '') +
      '  —  reading from ' + lib.root + '/');
    route();
  }

  function toast(title, body, warn) {
    var t = $('#toast');
    t.className = 'toast show' + (warn ? ' warn' : '');
    t.innerHTML = '<b>' + esc(title) + '</b><span>' + esc(body) + '</span>';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = 'toast'; }, 6000);
  }

  function init() {
    var input = $('#dirInput');
    $('#updateBtn').onclick = function () { input.value = ''; input.click(); };
    input.addEventListener('change', function () { scan(this.files); });

    var saved = load();
    if (saved) apply(saved); else stamp(null);
  }

  return { init: init, clear: clear, toast: toast, stamp: stamp,
           reset: function () { clear(); D.projects = BASELINE.slice(); stamp(null);
                                toast('Reset', 'Back to the list that shipped with the portal.'); route(); } };
})();

/* ============================================================
   SEARCH
   ============================================================ */
var Search = (function () {
  var el = $('#search'), input = $('#searchInput'), out = $('#searchResults');
  var index = [], sel = 0, rows = [];

  function build() {
    index = [];
    visible().forEach(function (p) {
      index.push({ t: 'project', name: p.name, path: 'Projects', href: '#/p/' + p.id, icon: 'folder' });
      (p.folders || []).forEach(function (f) {
        index.push({ t: 'folder', name: f.name, path: p.name,
                     href: '#/p/' + p.id + '/' + f.id, icon: 'folder' });
        (f.files || []).forEach(function (file) {
          if (file.missing) return;
          index.push({ t: 'file', name: file.label, alt: file.name,
                       path: p.name + ' · ' + f.name +
                             (file.youtube ? ' · YouTube' : ''),
                       file: file.youtube ? file.url : file.path,
                       icon: file.youtube ? 'youtube' : kindOf(file.name) });
        });
      });
    });
  }

  function score(hay, q) {
    hay = hay.toLowerCase();
    if (hay.indexOf(q) === 0) return 100;
    if (hay.indexOf(q) > -1) return 60;
    var i = 0;
    for (var c = 0; c < hay.length && i < q.length; c++) if (hay[c] === q[i]) i++;
    return i === q.length ? 25 : -1;
  }

  function mark(name, q) {
    var i = name.toLowerCase().indexOf(q);
    if (i < 0) return esc(name);
    return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + q.length)) +
           '</mark>' + esc(name.slice(i + q.length));
  }

  function render() {
    var q = input.value.trim().toLowerCase();
    var list = q
      ? index.map(function (r) { return { r: r, s: Math.max(score(r.name, q), score(r.alt || '', q) - 5) }; })
             .filter(function (x) { return x.s > 0; })
             .sort(function (a, b) { return b.s - a.s; })
             .slice(0, 40).map(function (x) { return x.r; })
      : index.slice(0, 14);

    if (!list.length) { out.innerHTML = '<div class="sr-empty">No matches for “' + esc(q) + '”</div>'; rows = []; return; }
    sel = 0;
    out.innerHTML = list.map(function (r, i) {
      var tag = r.external ? 'a href="' + esc(r.external) + '" target="_blank" rel="noopener noreferrer"'
              : r.href     ? 'a href="' + r.href + '"'
              : 'a href="' + esc(uri(r.file)) + '" target="_blank" rel="noopener"';
      return '<' + tag + ' class="sr' + (i === 0 ? ' sel' : '') + (r.external ? ' ext' : '') + '">' +
             '<span class="sr-ico">' + svg(r.icon) + '</span>' +
             '<span class="sr-txt"><div class="sr-name">' + mark(r.name, q) + '</div>' +
             '<div class="sr-path">' + esc(r.path) + '</div></span>' +
             '</a>';
    }).join('');
    rows = $$('.sr', out);
  }

  function move(d) {
    if (!rows.length) return;
    rows[sel].classList.remove('sel');
    sel = (sel + d + rows.length) % rows.length;
    rows[sel].classList.add('sel');
    rows[sel].scrollIntoView({ block: 'nearest' });
  }

  function open() {
    build(); el.hidden = false;
    requestAnimationFrame(function () { el.classList.add('show'); });
    input.value = ''; render(); input.focus();
    document.body.style.overflow = 'hidden';
  }
  function close() {
    el.classList.remove('show'); document.body.style.overflow = '';
    setTimeout(function () { el.hidden = true; }, 300);
  }

  input.addEventListener('input', render);
  el.addEventListener('click', function (e) { if (e.target === el) close(); });
  out.addEventListener('click', function () { close(); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); if (rows[sel]) rows[sel].click(); }
  });

  $('#searchBtn').onclick = open;
  return { open: open, close: close, get isOpen() { return !el.hidden; } };
})();

/* ============================================================
   PRESENTATION MODE + KEYS
   ============================================================ */
$('#presentBtn').onclick = function () { document.body.classList.toggle('present'); };

addEventListener('keydown', function (e) {
  var typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);

  if (e.key === 'Escape') {
    if (Search.isOpen) return Search.close();
    if (document.body.classList.contains('present'))
      return document.body.classList.remove('present');
    if (Route.away) history.back();
    return;
  }
  if (typing) return;

  if (e.key === '/') { e.preventDefault(); Search.open(); }
  else if (e.key === 'k' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); Search.open(); }
  else if (e.key.toLowerCase() === 'p') document.body.classList.toggle('present');
  else if (e.key.toLowerCase() === 'h') location.hash = '#/';
  else if (e.key.toLowerCase() === 'u') $('#updateBtn').click();
  else if (e.key.toLowerCase() === 'r' && e.shiftKey) Library.reset();
});

/* ============================================================
   BOOT
   ============================================================ */
(function boot() {
  var b = (D.brand && D.brand.hero) || {};
  if (b.wordA) $('#heroWordA').textContent = b.wordA;
  if (b.wordB) $('#heroWordB').textContent = b.wordB;
  if (b.date)  $('#heroDate').textContent  = b.date;
  if (b.cue)   $('#heroCue').firstChild.nodeValue = b.cue;

  var hm = b || {};
  if (hm.video)  $('#heroVideo').src = hm.video;
  if (hm.poster) $('#heroVideo').poster = hm.poster;
  if (hm.bg)     { var bgi = $('#heroBgImg'); if (bgi) bgi.src = hm.bg; }

  // hero video may not exist offline yet — drop it so the gradient shows
  var v = $('#heroVideo');
  v.addEventListener('error', function () { v.remove(); }, true);
  if (v.querySelector) setTimeout(function () {
    if (v.readyState === 0 && v.networkState === 3) v.remove();
  }, 1200);

  Library.init();
  Hero.paint();

  // deep link straight to a project? skip the hero entirely
  if ((location.hash || '').length > 2) { Hero.skip(); }

  route();
})();

})();

</script>
</body>
