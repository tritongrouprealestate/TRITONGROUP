<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Kali Puja Invitation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0c0916">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Marcellus&family=Tiro+Bangla&display=swap">
<style>
/* Layout: one night-time scroll. A gate with Maa's arch and five unlit diyas; every diya lit brightens the whole page and the idol, then a gold-bordered invitation card sits below. Single dark look by choice. */
:root{
  --night:#0c0916;
  --night-2:#171028;
  --gold:#f0b43c;
  --gold-soft:#ffdc92;
  --gold-dim:#7a5c24;
  --sindoor:#e0392d;
  --marigold:#ff8a1f;
  --text:#f7eedc;
  --muted:#c2b296;
  --lit:0;
  --display:'Marcellus','Tiro Bangla',Georgia,serif;
  --body:'Hind Siliguri',system-ui,'Segoe UI',sans-serif;
  color-scheme:dark;
}
:root[lang="bn"]{--display:'Tiro Bangla','Marcellus',Georgia,serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:clip}
body{
  margin:0;background:var(--night);color:var(--text);
  font-family:var(--body);font-size:1.0625rem;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;overflow-x:hidden;
}
:root[lang="bn"] body{line-height:1.8}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px;border-radius:6px}

/* atmosphere */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--gold-soft);opacity:.55;animation:tw 4s ease-in-out infinite}
@keyframes tw{50%{opacity:.12}}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--lit);transition:opacity 1s ease;
  background:radial-gradient(90% 60% at 50% 42%,rgba(255,150,40,.34),rgba(224,57,45,.10) 55%,transparent 78%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
main{position:relative;z-index:1}

/* controls */
.bar{position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--gold-dim);border-radius:999px;background:rgba(12,9,22,.78);backdrop-filter:blur(6px);overflow:hidden}
.seg button{border:0;background:none;padding:7px 14px;font-size:.9rem;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--gold);color:#2a1606;font-weight:600}
.snd{width:40px;height:40px;border-radius:50%;border:1px solid var(--gold-dim);background:rgba(12,9,22,.78);backdrop-filter:blur(6px);display:grid;place-items:center;padding:0}
.snd svg{width:20px;height:20px;stroke:var(--gold-soft);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.snd .off{display:none}
.snd[aria-pressed="true"] .on{display:none}
.snd[aria-pressed="true"] .off{display:block}

/* gate */
.gate{min-height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:calc(70px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));text-align:center}
.eyebrow{margin:0;font-size:.82rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
:root[lang="bn"] .eyebrow{letter-spacing:.06em;font-size:.95rem}
.gate h1{margin:0;font:400 clamp(2rem,8.5vw,3rem)/1.15 var(--display);text-wrap:balance;color:var(--gold-soft)}
.arch{position:relative;width:min(58vw,230px);aspect-ratio:3/4;border-radius:999px 999px 14px 14px;border:2px solid var(--gold);overflow:hidden;background:#000;
  box-shadow:0 0 calc(var(--lit)*80px) calc(var(--lit)*12px) rgba(255,140,40,calc(var(--lit)*.5));transition:box-shadow 1s ease}
.arch img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 38%;filter:brightness(calc(.07 + var(--lit)*.93)) saturate(calc(.4 + var(--lit)*.6));transition:filter 1s ease}
.diyas{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:380px;align-items:end}
.diya{position:relative;border:0;background:none;padding:6px 0 2px;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.diya:nth-child(1),.diya:nth-child(5){transform:translateY(14px)}
.diya:nth-child(2),.diya:nth-child(4){transform:translateY(5px)}
.diya svg{width:100%;max-width:70px;height:auto;overflow:visible;position:relative}
.diya .flame{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);opacity:0;transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.diya.lit .flame{transform:scale(1);opacity:1;animation:flick 1.6s ease-in-out .5s infinite}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(.94,1.07) rotate(-2deg)}65%{transform:scale(1.04,.95) rotate(2deg)}}
.diya::before{content:"";position:absolute;left:50%;top:18%;width:150%;aspect-ratio:1;translate:-50% -30%;border-radius:50%;background:radial-gradient(circle,rgba(255,170,50,.55),transparent 62%);opacity:0;transition:opacity .6s;pointer-events:none}
.diya.lit::before{opacity:1}
.diya:not(.lit)::after{content:"";position:absolute;left:50%;top:34%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid var(--gold);animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.hint{margin:0;min-height:3.2em;color:var(--muted);font-size:1rem}
.count{display:block;margin-top:2px;color:var(--gold-soft);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.skip{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:4px;font-size:.92rem;padding:10px 14px;min-height:44px}

/* invitation */
.invite{max-width:560px;margin:0 auto;padding-block:10px calc(56px + env(safe-area-inset-bottom,0px))}
.invite.show{animation:rise 1.1s ease both}
@keyframes rise{from{opacity:.0;transform:translateY(26px)}to{opacity:1;transform:none}}
.card{position:relative;background:linear-gradient(180deg,var(--night-2),#110b1e);border:1px solid var(--gold-dim);padding:0 0 30px;
  box-shadow:inset 0 0 0 7px var(--night),inset 0 0 0 8px var(--gold-dim),0 30px 80px rgba(0,0,0,.55);border-radius:6px;overflow:hidden}
.garland{height:26px;background:
  radial-gradient(circle at 14px 12px,#ffd04a 0 3px,var(--marigold) 4px 7px,#c8500c 8px 9px,transparent 10px) 0 0/28px 26px repeat-x;
  border-bottom:1px solid var(--gold-dim)}
.inner{padding:28px 26px 0;display:flex;flex-direction:column;gap:22px;align-items:center;text-align:center}
.inner>*{min-width:0;max-width:100%}
.card h2{margin:0;font:400 clamp(2.1rem,9vw,3rem)/1.12 var(--display);color:var(--gold-soft);text-wrap:balance}
.murti{width:min(78%,300px);aspect-ratio:4/5;border-radius:999px 999px 12px 12px;border:2px solid var(--gold);overflow:hidden;box-shadow:0 0 60px rgba(255,140,40,.35)}
.murti img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.dear{margin:0;font:400 1.5rem/1.3 var(--display);color:var(--text)}
.lead{margin:0;max-width:34ch;color:var(--text)}
.when{width:100%;display:grid;gap:14px;text-align:left}
.date{display:flex;align-items:center;gap:16px;border-top:1px solid var(--gold-dim);border-bottom:1px solid var(--gold-dim);padding:16px 2px}
.date .d{font:500 3.4rem/1 var(--body);color:var(--gold);font-variant-numeric:tabular-nums}
.date .m{display:flex;flex-direction:column;gap:2px}
.date b{font:400 1.25rem/1.25 var(--display);color:var(--gold-soft);font-weight:400}
.date span{color:var(--muted);font-size:.95rem}
.label{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
:root[lang="bn"] .label{letter-spacing:.04em;font-size:.92rem}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0}
.timeline li{position:relative;display:grid;grid-template-columns:8.2em 1fr;gap:12px;align-items:baseline;padding:8px 0 8px 24px}
.timeline li::before{content:"";position:absolute;left:4px;top:1.05em;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--marigold)}
.timeline li+li::after{content:"";position:absolute;left:8px;top:calc(-50% + 1.2em);height:100%;width:1px;background:var(--gold-dim)}
.timeline time{font:400 1.2rem/1.3 var(--display);color:var(--gold-soft);font-variant-numeric:tabular-nums}
.addr{margin:0;font-size:1.05rem}
.addr small{display:block;color:var(--muted);font-size:.95rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:999px;border:1px solid var(--gold);color:var(--gold-soft);background:transparent;text-decoration:none;font-weight:500;font-size:1rem}
.btn.fill{background:var(--gold);color:#2a1606;border-color:var(--gold);font-weight:600}
.btn.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff;font-weight:600}
.btn:hover{filter:brightness(1.12)}
.rsvp{width:100%;border:1px solid var(--gold-dim);border-radius:10px;padding:18px 14px;display:flex;flex-direction:column;gap:12px;align-items:center;background:rgba(255,255,255,.025)}
.rsvp p{margin:0}
.num{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.copy{border:1px solid var(--gold-dim);background:none;border-radius:8px;padding:4px 10px;font-size:.82rem;color:var(--gold-soft);min-height:32px}
.closing{margin:0;font-size:1.05rem}
.sign{font:400 1.25rem/1.35 var(--display);color:var(--gold-soft);margin:0}
.sign small{display:block;font:400 .95rem var(--body);color:var(--muted);margin-bottom:4px}
.replay{margin:22px auto 0;display:block}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--gold);color:#2a1606;padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;font-size:.95rem}
@media (max-width:380px){.timeline li{grid-template-columns:1fr;gap:0}.date .d{font-size:3rem}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .stars i,.diya:not(.lit)::after,.diya.lit .flame,.invite.show{animation:none}
  .arch img,.glow,.arch{transition:none}
}
</style>
</head><body>

  </button>
</div>

const $ = id => document.getElementById(id);
const root = document.documentElement;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

let litCount = 0, done = false;

/* ---------- stars ---------- */
(function(){
  const s = $("stars");
  for (let i = 0; i < 38; i++) {
    const e = document.createElement("i");
    e.style.left = (Math.random() * 100) + "%";

})();

/* ---------- diyas ---------- */
const diyaSVG = `
<svg viewBox="0 0 80 96" aria-hidden="true">
  <defs>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c46a2c"/><stop offset="1" stop-color="#6e2e12"/></linearGradient>

</svg>`;
const diyaBox = $("diyas");
const diyas = [];
for (let i = 0; i < 5; i++) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "diya"; b.innerHTML = diyaSVG;
  b.setAttribute("aria-label", "Diya " + (i + 1));
  b.addEventListener("click", () => lightDiya(i, true));
  diyaBox.appendChild(b); diyas.push(b);
}
/* unique gradient ids per diya are not needed: all share identical defs */

function setLit(n) {
  litCount = n;
  root.style.setProperty("--lit", (n / 5).toFixed(2));
}
function lightDiya(i, withFx) {
  if (diyas[i].classList.contains("lit")) return;
  diyas[i].classList.add("lit");
  setLit(litCount + 1);
  if (withFx) {
    ensureAudio();
    bell([523.25, 587.33, 659.25, 783.99, 880][litCount - 1], .22, 0);
    const r = diyas[i].getBoundingClientRect();
    sparks(r.left + r.width / 2, r.top + r.height * .25, 14);
  }
  renderHint();
  if (litCount === 5 && !done) {
    done = true;
    if (withFx) {
      setTimeout(() => { shankh(); petals(reduce ? 0 : 110); sparks(innerWidth / 2, innerHeight * .4, 40); }, 650);
    }
    setTimeout(reveal, withFx ? 1500 : 0);
  }
}
function reveal() {
  const inv = $("invite");
  inv.hidden = false;
  inv.classList.remove("show"); void inv.offsetWidth; inv.classList.add("show");
  setTimeout(() => inv.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }), 120);
}
function skipAll() {
  diyas.forEach((d, i) => lightDiya(i, false));
  done = true; reveal();
}
$("skip").addEventListener("click", skipAll);
$("replay").addEventListener("click", () => {
  diyas.forEach(d => d.classList.remove("lit"));
  setLit(0); done = false; $("invite").hidden = true; renderHint();
  window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
});

function renderHint() {
  const t = T[lang];
  $("hintText").textContent = litCount === 0 ? t.hint0 : litCount === 5 ? t.hintDone : t.hint1;
  $("count").textContent = t.count(litCount);
}
function setLang(l) {
  lang = l;
  const t = T[l];
  root.lang = l;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t[el.dataset.i]; });
  $("l-en").setAttribute("aria-pressed", String(l === "en"));
  $("l-bn").setAttribute("aria-pressed", String(l === "bn"));
  $("snd").setAttribute("aria-label", t.sound);
  diyas.forEach((d, i) => d.setAttribute("aria-label", (l === "bn" ? "প্রদীপ " + bnDigits(i + 1) : "Diya " + (i + 1))));
  $("faceImg").alt = l === "bn" ? "মা কালীর প্রতিমা" : "Maa Kali idol";
  document.title = l === "bn" ? "কালী পূজার আমন্ত্রণ" : "Kali Puja Invitation";
  renderHint();
  buildLinks();
}
$("l-en").addEventListener("click", () => setLang("en"));
$("l-bn").addEventListener("click", () => setLang("bn"));

/* ---------- links ---------- */
function buildLinks() {
  const t = T[lang];
  const q = new URLSearchParams({
    action: "TEMPLATE", text: t.calTitle,
    dates: "20261108T123000/20261108T170000", ctz: "Asia/Kolkata",
    details: "Puja begins 12:30 PM. Prasad and food from 2:30 PM.",
    location: "40/1 Post Office Road, Kolkata 700028"
  });
  $("calBtn").href = "https://calendar.google.com/calendar/render?" + q.toString();

  const wa = (CONFIG.whatsapp || "").replace(/\D/g, ""), call = (CONFIG.call || "").replace(/\D/g, "");
  $("rsvp").hidden = !(wa || call);
  if (wa) {
    $("waBtn").hidden = false;
    $("waBtn").href = "https://wa.me/" + wa + "?text=" + encodeURIComponent(t.waMsg);
    showNum("waNum", wa);
  }
  if (call) {
    $("callBtn").hidden = false;
    $("callBtn").href = "tel:+" + call;
    showNum("callNum", call);
  }
}
function showNum(id, digits) {
  const el = $(id); el.hidden = false;
  const shown = "+" + digits.replace(/^(\d{2})(\d{5})(\d+)$/, "$1 $2 $3");
  el.textContent = "";
  const span = document.createElement("span"); span.textContent = shown;
  const b = document.createElement("button"); b.type = "button"; b.className = "copy"; b.textContent = T[lang].copy;
  b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(shown); toast(T[lang].copied); }
    catch (e) {
      const r = document.createRange(); r.selectNodeContents(span);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    }
  });
  el.append(span, b);
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 1800);
}

/* ---------- particles ---------- */
const cv = $("fx"), cx = cv.getContext("2d");
let W = 0, H = 0, raf = 0; const ps = [];
function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
fit(); addEventListener("resize", fit);
function sparks(x, y, n) {
  if (reduce) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3.2;
    ps.push({ k: 0, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.6, life: 1, d: .016 + Math.random() * .02, r: 1.2 + Math.random() * 2, c: Math.random() < .5 ? "255,214,120" : "255,150,50" });
  }
  kick();
}
function petals(n) {
  const cols = ["255,138,31", "255,196,60", "224,57,45", "255,226,140"];
  for (let i = 0; i < n; i++) {
    ps.push({ k: 1, x: Math.random() * W, y: -20 - Math.random() * H * .5, vx: (Math.random() - .5) * 1.2, vy: 1.4 + Math.random() * 2.2, rot: Math.random() * 6, vr: (Math.random() - .5) * .12, w: 6 + Math.random() * 6, life: 1, d: 0, c: cols[i % 4], ph: Math.random() * 6 });
  }
  kick();
}
function kick() { if (!raf) raf = requestAnimationFrame(frame); }
function frame() {
  cx.clearRect(0, 0, W, H);
  for (let i = ps.length - 1; i >= 0; i--) {
    const p = ps[i];
    if (p.k === 0) {
      p.x += p.vx; p.y += p.vy; p.vy += .05; p.vx *= .985; p.life -= p.d;
      cx.fillStyle = `rgba(${p.c},${Math.max(p.life, 0)})`;
      cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.3); cx.fill();
      if (p.life <= 0) ps.splice(i, 1);
    } else {
      p.ph += .05; p.x += p.vx + Math.sin(p.ph) * .9; p.y += p.vy; p.rot += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
      cx.fillStyle = `rgba(${p.c},.92)`;
      cx.beginPath(); cx.ellipse(0, 0, p.w, p.w * .45, 0, 0, 6.3); cx.fill(); cx.restore();
      if (p.y > H + 30) ps.splice(i, 1);
    }
  }
  raf = ps.length ? requestAnimationFrame(frame) : 0;
  if (!ps.length) cx.clearRect(0, 0, W, H);
}

/* ---------- sound (synthesised in the browser, nothing to download) ---------- */
let ac = null, master = null, bus = null, muted = false, timer = 0, step = 0;
function ensureAudio() {
  try {
    if (!ac) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      ac = new C();
      const comp = ac.createDynamicsCompressor();
      master = ac.createGain(); master.gain.value = muted ? 0 : .9;
      master.connect(comp); comp.connect(ac.destination);
      bus = ac.createGain(); bus.gain.value = .5;
      const dl = ac.createDelay(1); dl.delayTime.value = .31;
      const fb = ac.createGain(); fb.gain.value = .38;
      const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1800;
      bus.connect(master); bus.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(master);
      drone();
      timer = setInterval(tick, 950);
    }
    if (ac.state === "suspended" && !muted) ac.resume();
  } catch (e) { ac = null; }
}
function drone() {
  const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.value = 73.42; o2.type = "sine"; o2.frequency.value = 110.1;
  g.gain.value = .0; g.gain.linearRampToValueAtTime(.07, ac.currentTime + 4);
  o.connect(g); o2.connect(g); g.connect(bus); o.start(); o2.start();
}
function pluck(f, t, dur, vol) {
  const g = ac.createGain(), lp = ac.createBiquadFilter();
  lp.type = "lowpass"; lp.frequency.setValueAtTime(f * 8, t); lp.frequency.exponentialRampToValueAtTime(f * 2, t + dur * .7);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  [1, 1.004].forEach(m => { const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = f * m; o.connect(lp); o.start(t); o.stop(t + dur + .05); });
  lp.connect(g); g.connect(bus);
}
function tick() {
  if (!ac || muted || ac.state !== "running") return;
  const seq = [110.2, 146.83, 146.83, 73.42], t = ac.currentTime + .05;
  pluck(seq[step % 4], t, 3.4, .13);
  if (step % 9 === 4) bell(1174.66, .035, t + .3, true);
  step++;
}
function bell(f, vol, delay, toBus) {
  if (!ac || muted) return;
  const t = ac.currentTime + (delay || 0) + .01;
  [[1, 1, 2.6], [2.76, .5, 1.9], [5.4, .25, 1.2], [8.93, .12, .7]].forEach(([r, a, d]) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.value = f * r;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * a, t + .008); g.gain.exponentialRampToValueAtTime(.0005, t + d);
    o.connect(g); g.connect(toBus ? bus : master); o.start(t); o.stop(t + d + .05);
  });
}
function shankh() {
  if (!ac || muted) return;
  const t = ac.currentTime + .02, dur = 3.6;
  const lp = ac.createBiquadFilter(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
  lp.type = "lowpass"; lp.frequency.setValueAtTime(500, t); lp.frequency.linearRampToValueAtTime(1500, t + .9); lp.frequency.linearRampToValueAtTime(700, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.3, t + .55); g.gain.setValueAtTime(.3, t + 2.2); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  lfo.frequency.value = 5.2; lg.gain.value = 3.5; lfo.connect(lg);
  [[196, "sawtooth"], [197.2, "sawtooth"], [392, "triangle"]].forEach(([f, type]) => {
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f * .96, t); o.frequency.linearRampToValueAtTime(f, t + .5);
    lg.connect(o.frequency); o.connect(lp); o.start(t); o.stop(t + dur + .1);
  });
  lfo.start(t); lfo.stop(t + dur + .1);
  lp.connect(g); g.connect(master);
}
$("snd").addEventListener("click", () => {
  if (!ac) { muted = false; $("snd").setAttribute("aria-pressed", "false"); ensureAudio(); return; }
  muted = !muted;
  $("snd").setAttribute("aria-pressed", String(muted));
  if (ac) {
    master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.linearRampToValueAtTime(muted ? 0 : .9, ac.currentTime + .25);
    if (!muted && ac.state === "suspended") ac.resume();
  }
});
document.addEventListener("visibilitychange", () => {
  if (!ac) return;
  if (document.hidden) ac.suspend(); else if (!muted) ac.resume();
});

setLang(lang);
</script>
